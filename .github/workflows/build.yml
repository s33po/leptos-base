name: Build Image
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and push (default: branch name)'
        required: false
        default: ''

env:
  IMAGE_NAME: leptos-base
  MAJOR_VERSION: 10
  CENTOS_BOOTC_IMAGE: quay.io/centos-bootc/centos-bootc:stream10
  DEFAULT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  IMAGE_FULL: ghcr.io/${{ github.repository }}
  REGISTRY_DOMAIN: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Check for updates"
        if: ${{ github.event_name == 'schedule' }}  # Only run if triggered by schedule
        run: |
          upd=0
          podman run --quiet --rm ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }} dnf check-update || upd=$?

          echo "upd=${upd}" >> "$GITHUB_ENV"
          echo "Exit code from dnf check-update: '${upd}'"

      - name: "Setup"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        shell: "bash"
        run: |
            echo "DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
            sudo mkdir -p /etc/containers/registries.d
            echo -e "docker:\n  ${{ env.REGISTRY_DOMAIN }}:\n    use-sigstore-attachments: true" \
                | sudo tee -a /etc/containers/registries.d/${{ env.REGISTRY_DOMAIN }}.yaml
            podman pull "${{ env.CENTOS_BOOTC_IMAGE }}"
            {
              echo "CHUNKAH_CONFIG_STR<<CHUNKEOF"
              podman inspect "${{ env.CENTOS_BOOTC_IMAGE }}" | jq -c .
              echo "CHUNKEOF"
            } >> "$GITHUB_ENV"

      - name: "Build and Rechunk with Chunkah"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/buildah-build@v3.1.0
        with:
          containerfiles: "/build/Containerfile"
          oci: true
          tags: ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}
          build-args: |
            CENTOS_BOOTC_IMAGE=${{ env.CENTOS_BOOTC_IMAGE }}
            CHUNKAH_CONFIG_STR=${{ env.CHUNKAH_CONFIG_STR }}
          extra-args: |
            --cap-add=all
            --device=/dev/fuse
            --skip-unused-stages=false
            --security-opt=label=disable
            -v ${{ github.workspace }}:/run/src

      - name: "GHCR Login"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/podman-login@v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Push image"
        if: ${{ github.event_name == 'workflow_dispatch' || env.upd != 0 }}
        uses: redhat-actions/push-to-registry@v3.0.0
        id: "push"
        with:
          tags: ${{ env.IMAGE_FULL }}:${{ env.DEFAULT_TAG }}
          extra-args: |
            --compression-format=zstd:chunked
            --compression-level=3
            --force-compression
